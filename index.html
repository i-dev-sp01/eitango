<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語音声 → 日本語</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --text:#1c2230; --sub:#667085; --accent:#2f6fed;
    --rec:#e5383b; --line:#e3e7ee;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10131a; --card:#1a1f2b; --text:#edf0f6; --sub:#9aa4b8; --accent:#6c9bff; --rec:#ff6b6e; --line:#2b3243; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:720px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:14px 0 6px}
  h1{font-size:20px;margin:0}
  .meta{text-align:right;font-size:12px;color:var(--sub);line-height:1.5}
  .meta b{color:var(--text);font-weight:600}
  .mic-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0 12px}
  #micBtn{
    width:104px;height:104px;border-radius:50%;border:none;background:var(--accent);color:#fff;
    font-size:44px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(47,111,237,.35);touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;cursor:pointer;transition:transform .1s
  }
  #micBtn:active{transform:scale(.96)}
  #micBtn.rec{background:var(--rec);box-shadow:0 0 0 0 rgba(229,56,59,.5);animation:pulse 1.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 22px rgba(229,56,59,0)}100%{box-shadow:0 0 0 0 rgba(229,56,59,0)}}
  #status{font-size:14px;color:var(--sub);min-height:20px;text-align:center}
  #heard{font-size:18px;font-weight:600;min-height:26px;text-align:center}
  .manual{display:flex;gap:8px;margin:8px 0 4px}
  .manual input{flex:1;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
  .manual button{font-size:15px;padding:10px 16px;border:none;border-radius:10px;background:var(--accent);color:#fff}
  #warn{display:none;background:#fff3cd;color:#664d03;border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0;line-height:1.5}
  h2{font-size:15px;color:var(--sub);margin:20px 0 8px;font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .card .top{display:flex;align-items:baseline;gap:8px}
  .card .word{font-size:22px;font-weight:700}
  .card .rank{font-size:11px;color:var(--sub)}
  .card .conf{margin-left:auto;font-size:12px;color:var(--accent)}
  .sec{font-size:11px;color:var(--sub);margin-top:8px;font-weight:600}
  .body{font-size:14px;line-height:1.6;margin-top:2px;white-space:pre-wrap}
  .body.dim{color:var(--sub)}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 0}
  footer{margin-top:24px;text-align:center;font-size:11px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎙 英語音声 → 日本語</h1>
    <div class="meta">
      <div>Version <b id="ver"></b></div>
      <div id="clock"></div>
    </div>
  </header>

  <div id="warn"></div>

  <div class="mic-area">
    <button id="micBtn" aria-label="音声入力の開始/停止">🎤</button>
    <div id="status">マイクをタップして英単語を話してください</div>
    <div id="heard"></div>
  </div>

  <form class="manual" id="manualForm">
    <input id="manualInput" type="text" placeholder="英単語を手入力でも検索 (例: freedom)" autocomplete="off">
    <button type="submit">検索</button>
  </form>

  <h2>候補一覧</h2>
  <div id="list"><div class="empty">まだ候補はありません</div></div>

  <footer>翻訳: MyMemory / 概念: Wikipedia（日本語版）より取得</footer>
</div>

<script>
(function(){
  "use strict";
  var VERSION = "1.1.0";
  var BUILD   = "2026-10-28";
  document.getElementById("ver").textContent = VERSION + " (" + BUILD + ")";

  // ---- 日時（年月日 時:分） ----
  var clockEl = document.getElementById("clock");
  function pad(n){ return (n<10?"0":"")+n; }
  function tick(){
    var d = new Date();
    clockEl.textContent = d.getFullYear()+"年"+pad(d.getMonth()+1)+"月"+pad(d.getDate())+"日 "+pad(d.getHours())+":"+pad(d.getMinutes());
  }
  tick(); setInterval(tick, 5000);

  // ---- 要素 ----
  var micBtn = document.getElementById("micBtn");
  var statusEl = document.getElementById("status");
  var heardEl = document.getElementById("heard");
  var listEl = document.getElementById("list");
  var warnEl = document.getElementById("warn");

  function setStatus(t){ statusEl.textContent = t; }

  // ---- 音声認識 ----
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recog = null;
  var wantListening = false;   // ユーザーが「開始」状態にしているか
  var starting = false;

  if(!SR){
    warnEl.style.display = "block";
    warnEl.textContent = "このブラウザでは音声認識(Web Speech API)が使えません。iOS の Chrome では非対応の場合があります。Safari で開くか、下の入力欄に英単語を入力してください。";
    setStatus("音声認識は利用できません");
  }

  function createRecog(){
    var r = new SR();
    r.lang = "en-US";
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 10;

    r.onstart = function(){
      starting = false;
      micBtn.classList.add("rec");
      setStatus("聞いています… もう一度タップで停止");
    };
    r.onresult = function(e){
      for(var i=e.resultIndex; i<e.results.length; i++){
        var res = e.results[i];
        if(res.isFinal){
          var alts = [];
          for(var j=0;j<res.length;j++){
            alts.push({text:res[j].transcript.trim(), conf:res[j].confidence});
          }
          heardEl.textContent = alts[0] ? alts[0].text : "";
          showCandidates(alts);
        }else{
          heardEl.textContent = res[0].transcript;
        }
      }
    };
    r.onerror = function(e){
      starting = false;
      if(e.error === "not-allowed" || e.error === "service-not-allowed"){
        wantListening = false;
        setStatus("マイクの使用が許可されていません（設定で許可してください）");
      }else if(e.error === "no-speech"){
        setStatus("音声が検出されませんでした。話してください…");
      }else if(e.error === "aborted"){
        // 手動停止
      }else{
        setStatus("エラー: " + e.error);
      }
    };
    r.onend = function(){
      starting = false;
      // 自動終了した場合、ユーザーが停止していなければ再開
      if(wantListening){
        setTimeout(function(){ if(wantListening) safeStart(); }, 250);
      }else{
        micBtn.classList.remove("rec");
        micBtn.textContent = "🎤";
        if(!/エラー|許可/.test(statusEl.textContent)) setStatus("停止しました。タップで再開");
      }
    };
    return r;
  }

  function safeStart(){
    if(starting) return;
    starting = true;
    try{
      recog = createRecog();   // 毎回新規作成（iOSでの安定性のため）
      recog.start();
    }catch(err){
      starting = false;
      setStatus("開始できませんでした: " + err.message);
    }
  }

  function startListening(){
    wantListening = true;
    heardEl.textContent = "";
    listEl.innerHTML = '<div class="empty">話してください…</div>';
    micBtn.textContent = "⏹";
    setStatus("準備中…");
    safeStart();
  }
  function stopListening(){
    wantListening = false;
    micBtn.classList.remove("rec");
    micBtn.textContent = "🎤";
    setStatus("停止しました。タップで再開");
    try{ if(recog) recog.stop(); }catch(e){}
  }

  micBtn.addEventListener("click", function(){
    if(!SR){ return; }
    if(wantListening){ stopListening(); } else { startListening(); }
  });

  // ---- 手入力 ----
  document.getElementById("manualForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var inp = document.getElementById("manualInput");
    var v = inp.value.trim();
    if(!v) return;
    heardEl.textContent = v;
    showCandidates([{text:v, conf:1}]);
    inp.blur();
  });

  // ---- 候補表示 ----
  function showCandidates(alts){
    var seen = {}, uniq = [];
    alts.forEach(function(a){
      if(a.text && !seen[a.text]){ seen[a.text]=1; uniq.push(a); }
    });
    listEl.innerHTML = "";
    if(!uniq.length){
      listEl.innerHTML = '<div class="empty">候補が見つかりませんでした</div>';
      return;
    }
    uniq.forEach(function(a, idx){
      var card = document.createElement("div"); card.className = "card";

      var top = document.createElement("div"); top.className = "top";
      var w = document.createElement("span"); w.className = "word"; w.textContent = a.text;
      var rk = document.createElement("span"); rk.className = "rank"; rk.textContent = "候補 " + (idx+1);
      top.appendChild(w); top.appendChild(rk);
      if(typeof a.conf === "number" && a.conf > 0){
        var cf = document.createElement("span"); cf.className = "conf";
        cf.textContent = "確度 " + Math.round(a.conf*100) + "%";
        top.appendChild(cf);
      }
      card.appendChild(top);

      var s1 = document.createElement("div"); s1.className = "sec"; s1.textContent = "日本語";
      var b1 = document.createElement("div"); b1.className = "body dim"; b1.textContent = "変換中…";
      var s2 = document.createElement("div"); s2.className = "sec"; s2.textContent = "概念・解説";
      var b2 = document.createElement("div"); b2.className = "body dim"; b2.textContent = "読み込み中…";
      card.appendChild(s1); card.appendChild(b1); card.appendChild(s2); card.appendChild(b2);
      listEl.appendChild(card);

      translate(a.text).then(function(ja){
        fill(b1, ja);
        b1.style.fontSize = "18px"; b1.style.fontWeight = "600";
        return concept(a.text, ja);
      }).then(function(t){ fill(b2, t); });
    });
  }

  function fill(el, text){
    if(text){ el.className = "body"; el.textContent = text; }
    else { el.className = "body dim"; el.textContent = "情報が見つかりませんでした"; }
  }

  // ---- 英語 → 日本語 ----
  var tcache = {};
  function translate(word){
    var k = word.toLowerCase();
    if(tcache[k]) return tcache[k];
    var p = fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(word)+"&langpair=en|ja")
      .then(function(r){ return r.json(); })
      .then(function(d){
        var t = d && d.responseData && d.responseData.translatedText;
        return t ? t.trim() : "";
      }).catch(function(){ return ""; });
    tcache[k] = p;
    return p;
  }

  // 概念: 英語版Wikipediaの言語間リンク→日本語版の解説。なければ訳語で日本語版を検索
  function concept(en, ja){
    return api("en.wikipedia.org", {action:"query", titles:en, redirects:1, prop:"langlinks", lllang:"ja"})
      .then(function(d){
        var title = "";
        if(d && d.query && d.query.pages){
          Object.keys(d.query.pages).forEach(function(id){
            var ll = d.query.pages[id].langlinks;
            if(ll && ll[0]) title = ll[0]["*"] || ll[0].title || "";
          });
        }
        return title || ja;
      })
      .catch(function(){ return ja; })
      .then(function(t){ return t ? lookup("ja.wikipedia.org", t, 280) : ""; });
  }

  // ---- 辞書/百科検索 (MediaWiki API, CORS対応) ----
  var cache = {};
  function api(host, params){
    var q = Object.keys(params).map(function(k){
      return encodeURIComponent(k)+"="+encodeURIComponent(params[k]);
    }).join("&");
    return fetch("https://"+host+"/w/api.php?"+q+"&format=json&origin=*")
      .then(function(r){ return r.json(); });
  }
  function firstPage(data){
    if(!data || !data.query || !data.query.pages) return null;
    var ids = Object.keys(data.query.pages);
    var best = null;
    ids.forEach(function(id){
      var p = data.query.pages[id];
      if(p && !p.missing && p.extract && (!best || (p.index||0) < (best.index||0))) best = p;
    });
    return best;
  }
  function clean(t, max){
    t = (t||"").replace(/\s+\n/g,"\n").replace(/\n{2,}/g,"\n").trim();
    if(t.length > max) t = t.slice(0, max) + "…";
    return t;
  }
  function lookup(host, word, max){
    var key = host+"|"+word;
    if(cache[key]) return cache[key];
    var base = {action:"query", prop:"extracts", exintro:1, explaintext:1, redirects:1};
    var p = api(host, Object.assign({titles:word}, base)).then(function(d){
      var pg = firstPage(d);
      if(pg) return clean(pg.extract, max);
      // 完全一致がなければ検索の先頭を使う
      return api(host, Object.assign({generator:"search", gsrsearch:word, gsrlimit:1}, base)).then(function(d2){
        var pg2 = firstPage(d2);
        return pg2 ? clean("【" + pg2.title + "】\n" + pg2.extract, max) : "";
      });
    }).catch(function(){ return ""; });
    cache[key] = p;
    return p;
  }
})();
</script>
</body>
</html>
